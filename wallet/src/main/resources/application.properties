spring.application.name=wallet
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/wallet}
spring.datasource.username=${POSTGRES_USER:wallet}
spring.datasource.password=${POSTGRES_PASSWORD:wallet_local_demo}
spring.datasource.hikari.maximum-pool-size=10
custody.frontend-origin=${CUSTODY_FRONTEND_ORIGIN:http://localhost:3000}
custody.secure-cookie=${CUSTODY_SECURE_COOKIE:false}
# Never log credentials or request bodies, including when debugging other modules.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc=INFO
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.config.import=optional:file:./config/moonpay-local.properties,optional:file:./config/transak-local.properties
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
moonpay.environment=${MOONPAY_ENVIRONMENT:sandbox}
moonpay.publishable-key=${MOONPAY_PUBLISHABLE_KEY:}
moonpay.secret-key=${MOONPAY_SECRET_KEY:}
moonpay.ip-matching=${MOONPAY_IP_MATCHING:true}
moonpay.sandbox-client-ip=${MOONPAY_SANDBOX_CLIENT_IP:}
moonpay.trusted-proxies=${MOONPAY_TRUSTED_PROXIES:}

transak.environment=${TRANSAK_ENVIRONMENT:staging}
transak.api-key=${TRANSAK_API_KEY:}
transak.api-secret=${TRANSAK_API_SECRET:}
transak.referrer-domain=${TRANSAK_REFERRER_DOMAIN:http://localhost:3000}
transak.sandbox-client-ip=${TRANSAK_SANDBOX_CLIENT_IP:}
transak.trusted-proxies=${TRANSAK_TRUSTED_PROXIES:}
balance.ethereum-rpc=${ETHEREUM_RPC_URL:https://ethereum-rpc.publicnode.com}
balance.sepolia-rpc=${SEPOLIA_RPC_URL:https://ethereum-sepolia-rpc.publicnode.com}
balance.optimism-rpc=${OPTIMISM_RPC_URL:https://optimism-rpc.publicnode.com}
balance.bitcoin-api=${BITCOIN_API_URL:https://mempool.space/api}
balance.appchain-rpc=${APPCHAIN_RPC_URL:http://127.0.0.1:9545}
balance.appchain-id=${APPCHAIN_CHAIN_ID:42069}
payment.simulator-url=${PAYMENT_SIMULATOR_URL:http://127.0.0.1:8090}
spring.jackson.deserialization.accept-float-as-int=false
